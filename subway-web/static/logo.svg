<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0F2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
  </defs>

  <!-- 배경 원 -->
  <circle cx="70" cy="70" r="70" fill="url(#bg)"/>

  <!-- 지하철 차량 몸체 -->
  <rect x="22" y="52" width="96" height="46" rx="12" fill="url(#accent)"/>

  <!-- 창문 3개 -->
  <rect x="31" y="61" width="20" height="14" rx="4" fill="white" opacity="0.9"/>
  <rect x="60" y="61" width="20" height="14" rx="4" fill="white" opacity="0.9"/>
  <rect x="89" y="61" width="20" height="14" rx="4" fill="white" opacity="0.9"/>

  <!-- 출입문 선 -->
  <line x1="70" y1="52" x2="70" y2="98" stroke="white" stroke-width="1.5" opacity="0.3"/>

  <!-- 하단 바퀴 -->
  <circle cx="42" cy="100" r="7" fill="#1E3A5F" stroke="#3B82F6" stroke-width="2.5"/>
  <circle cx="42" cy="100" r="2.5" fill="#3B82F6"/>
  <circle cx="98" cy="100" r="7" fill="#1E3A5F" stroke="#3B82F6" stroke-width="2.5"/>
  <circle cx="98" cy="100" r="2.5" fill="#3B82F6"/>

  <!-- 레일 선 -->
  <line x1="10" y1="107" x2="130" y2="107" stroke="#3B82F6" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>

  <!-- 하단 텍스트 -->
  <text x="70" y="128" font-family="'Arial', sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2" opacity="0.85">METROHUB</text>
</svg>
