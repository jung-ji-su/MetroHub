server:
  port: ${PORT:8080}
  servlet:
    async:
      timeout: 1800000  # SSE 30분

spring:
  application:
    name: subway-api

  main:
    lazy-initialization: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/metrohub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:metrohub}
    password: ${SPRING_DATASOURCE_PASSWORD:metrohub}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 30000
      connection-test-query: SELECT 1
      initialization-fail-timeout: -1

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: all
      properties:
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000
    consumer:
      group-id: subway-api-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.metrohub.api.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

jwt:
  secret: ${JWT_SECRET:bWV0cm9odWItc3VwZXItc2VjcmV0LWp3dC1zaWduaW5nLWtleS1mb3ItZGV2LW9ubHk=}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

seoul:
  api:
    key: ${SEOUL_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  info:
    title: MetroHub API
    version: v1
    description: 서울 지하철 실시간 정보 플랫폼 API

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  health:
    kafka:
      enabled: false
    db:
      enabled: false
  metrics:
    tags:
      application: subway-api

logging:
  level:
    com.metrohub: DEBUG
    org.mybatis: DEBUG
