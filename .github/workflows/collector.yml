name: Subway Data Collector

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 (공개 레포 — Actions 무제한)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: subway-collector/requirements.txt

      - name: Install dependencies
        working-directory: subway-collector
        run: pip install -r requirements.txt

      - name: Run collector (one-shot)
        working-directory: subway-collector
        env:
          SEOUL_API_KEY:            ${{ secrets.SEOUL_API_KEY }}
          KAFKA_BOOTSTRAP_SERVERS:  ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SECURITY_PROTOCOL:  SASL_SSL
          KAFKA_SASL_MECHANISM:     SCRAM-SHA-256
          KAFKA_SASL_USERNAME:      ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD:      ${{ secrets.KAFKA_SASL_PASSWORD }}
        run: python collect_once.py
