name: Render Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake metrohub-api
        run: |
          echo "Pinging metrohub-api..."
          curl --max-time 120 --retry 0 --silent --show-error \
            https://metrohub-api.onrender.com/actuator/health || true

      - name: Wake metrohub-notification
        run: |
          echo "Pinging metrohub-notification..."
          curl --max-time 120 --retry 0 --silent --show-error \
            https://metrohub-notification.onrender.com/actuator/health || true
