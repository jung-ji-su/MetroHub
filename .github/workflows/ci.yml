name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-subway-api:
    name: Build subway-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build and Test
        working-directory: subway-api
        run: gradle build --no-daemon

      - name: Build Docker image
        working-directory: subway-api
        run: docker build -t subway-api:${{ github.sha }} .

  build-subway-notification:
    name: Build subway-notification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build and Test
        working-directory: subway-notification
        run: gradle build --no-daemon

      - name: Build Docker image
        working-directory: subway-notification
        run: docker build -t subway-notification:${{ github.sha }} .

  build-subway-collector:
    name: Build subway-collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: subway-collector
        run: pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: subway-collector
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=__pycache__

      - name: Build Docker image
        working-directory: subway-collector
        run: docker build -t subway-collector:${{ github.sha }} .
