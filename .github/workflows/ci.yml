name: CI/CD

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/metrohub

jobs:
  # ── 백엔드 빌드 & 테스트 ─────────────────────────────────────────────
  test-subway-api:
    name: Test subway-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Tests
        working-directory: subway-api
        run: gradle test --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ''
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3Rpbmctb25seS0zMmJ5dGVz

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subway-api-test-results
          path: subway-api/build/reports/tests/

  test-subway-notification:
    name: Test subway-notification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Tests
        working-directory: subway-notification
        run: gradle test --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ''
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3Rpbmctb25seS0zMmJ5dGVz

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subway-notification-test-results
          path: subway-notification/build/reports/tests/

  # ── Python 린트 ──────────────────────────────────────────────────────
  lint-collector:
    name: Lint subway-collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: subway-collector
        run: pip install -r requirements.txt flake8

      - name: Lint
        working-directory: subway-collector
        run: flake8 .

  # ── 프론트엔드 빌드 & 타입 체크 ──────────────────────────────────────
  build-web:
    name: Build subway-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: subway-web/package-lock.json

      - name: Install dependencies
        working-directory: subway-web
        run: npm ci

      - name: Type check
        working-directory: subway-web
        run: npm run check
        continue-on-error: true

      - name: Build
        working-directory: subway-web
        run: npm run build
        env:
          VITE_API_BASE: ''
          VITE_NOTIFICATION_BASE: ''

  # ── Docker 이미지 빌드 & 푸시 (master 브랜치 push 시만) ─────────────
  docker-publish:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-subway-api, test-subway-notification, lint-collector, build-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push subway-api
        uses: docker/build-push-action@v5
        with:
          context: subway-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push subway-notification
        uses: docker/build-push-action@v5
        with:
          context: subway-notification
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-notification:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-notification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push subway-collector
        uses: docker/build-push-action@v5
        with:
          context: subway-collector
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push subway-web
        uses: docker/build-push-action@v5
        with:
          context: subway-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Render 자동 배포 ──────────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Deploy metrohub-api
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Deploy metrohub-notification
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION }}"

  # ── Vercel 프론트엔드 배포 ────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [test-subway-api, test-subway-notification, lint-collector, build-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings & env vars
        working-directory: subway-web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        working-directory: subway-web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        working-directory: subway-web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
