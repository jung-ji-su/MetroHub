apiVersion: apps/v1
kind: Deployment
metadata:
  name: subway-web
  namespace: metrohub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subway-web
  template:
    metadata:
      labels:
        app: subway-web
    spec:
      containers:
        - name: subway-web
          image: ghcr.io/jung-ji-su/metrohub-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
