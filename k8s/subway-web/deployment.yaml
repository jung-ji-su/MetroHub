apiVersion: apps/v1
kind: Deployment
metadata:
  name: subway-web
  namespace: metrohub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subway-web
  template:
    metadata:
      labels:
        app: subway-web
    spec:
      containers:
        - name: subway-web
          image: ghcr.io/OWNER/metrohub-web:latest  # OWNER를 실제 GitHub username으로 변경
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
