apiVersion: v1
kind: ConfigMap
metadata:
  name: metrohub-config
  namespace: metrohub
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/metrohub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
  SPRING_DATASOURCE_USERNAME: "metrohub"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  CORS_ALLOWED_ORIGINS: "https://metrohub.vercel.app"  # Vercel 배포 후 실제 URL로 교체
