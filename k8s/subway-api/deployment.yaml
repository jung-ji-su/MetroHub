apiVersion: apps/v1
kind: Deployment
metadata:
  name: subway-api
  namespace: metrohub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subway-api
  template:
    metadata:
      labels:
        app: subway-api
    spec:
      containers:
        - name: subway-api
          image: metrohub/subway-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: metrohub-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metrohub-secrets
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: metrohub-secrets
                  key: jwt-secret
            - name: SEOUL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metrohub-secrets
                  key: seoul-api-key
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
