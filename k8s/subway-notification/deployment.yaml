apiVersion: apps/v1
kind: Deployment
metadata:
  name: subway-notification
  namespace: metrohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subway-notification
  template:
    metadata:
      labels:
        app: subway-notification
    spec:
      containers:
        - name: subway-notification
          image: ghcr.io/jung-ji-su/metrohub-notification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: metrohub-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metrohub-secrets
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: metrohub-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
