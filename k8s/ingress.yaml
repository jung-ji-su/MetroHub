apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrohub-ingress
  namespace: metrohub
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # SSE 연결을 위해 버퍼링 비활성화
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: metrohub.example.com  # 실제 도메인으로 변경
      http:
        paths:
          # 메인 API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: subway-api
                port:
                  number: 8080
          # 알림 서비스
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: subway-notification
                port:
                  number: 8081
          # 프론트엔드 (기본)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: subway-web
                port:
                  number: 80
