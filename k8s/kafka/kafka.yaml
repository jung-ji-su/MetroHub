apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: metrohub
spec:
  replicas: 1
  strategy:
    type: Recreate  # PVC ReadWriteOnce + .lock 충돌 방지 — 구 파드 완전 종료 후 신 파드 시작
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false  # k8s가 KAFKA_PORT 등 KAFKA_* 환경변수 자동 주입하는 것을 차단
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-kafka-data
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/kafka-data && chmod 755 /var/kafka-data && rm -f /var/kafka-data/.lock"]
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka-data
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
            - containerPort: 29092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/var/kafka-data"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka-data
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: metrohub
spec:
  selector:
    app: kafka
  ports:
    - name: external
      port: 9092
      targetPort: 9092
    - name: internal
      port: 29092
      targetPort: 29092
  type: ClusterIP
