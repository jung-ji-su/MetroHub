apiVersion: apps/v1
kind: Deployment
metadata:
  name: subway-collector
  namespace: metrohub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subway-collector
  template:
    metadata:
      labels:
        app: subway-collector
    spec:
      containers:
        - name: subway-collector
          image: ghcr.io/jung-ji-su/metrohub-collector:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: metrohub-config
          env:
            - name: SEOUL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metrohub-secrets
                  key: seoul-api-key
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
