global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'subway-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['subway-api:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'subway-api'

  - job_name: 'subway-notification'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['subway-notification:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'subway-notification'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
